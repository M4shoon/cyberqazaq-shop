<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberQazaq — Әкімші кіру</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #080b14;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Ambient glows */
    .glow-1 {
      position: fixed; top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,58,237,0.18) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .glow-2 {
      position: fixed; bottom: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(217,70,239,0.14) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* Floating bg icons */
    .bg-icons { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-icon {
      position: absolute; opacity: 0.05;
      animation: floatBg 9s ease-in-out infinite;
    }
    .bg-icon:nth-child(1) { top: 8%;  left: 5%;  animation-delay: 0s; }
    .bg-icon:nth-child(2) { top: 12%; right: 7%; animation-delay: -3s; }
    .bg-icon:nth-child(3) { bottom: 10%; left: 8%; animation-delay: -6s; }
    .bg-icon:nth-child(4) { bottom: 6%;  right: 5%; animation-delay: -1.5s; }
    @keyframes floatBg {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-20px) rotate(2deg); }
    }

    /* Logo */
    .top-logo {
      position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
      z-index: 20; text-align: center;
    }
    .logo-text {
      font-size: 22px; font-weight: 900;
      background: linear-gradient(90deg, #fff 30%, #c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-sub { font-size: 11px; color: #4b5563; letter-spacing: 2.5px; text-transform: uppercase; }

    /* Card */
    .card {
      position: relative; z-index: 10;
      width: 420px;
      background: rgba(15, 10, 30, 0.92);
      backdrop-filter: blur(32px);
      border: 1px solid rgba(168,85,247,0.22);
      border-radius: 28px;
      padding: 48px 44px 44px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 80px rgba(0,0,0,0.6),
        0 0 80px rgba(124,58,237,0.15);
    }

    .card-icon {
      width: 64px; height: 64px; border-radius: 20px;
      background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(217,70,239,0.2));
      border: 1px solid rgba(168,85,247,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 24px;
    }

    .card-title {
      font-size: 26px; font-weight: 900; color: white;
      text-align: center; margin-bottom: 6px; letter-spacing: -0.02em;
    }
    .card-sub {
      font-size: 14px; color: #4b5563; text-align: center; margin-bottom: 36px;
    }

    /* Error */
    .error-msg {
      padding: 12px 16px; border-radius: 12px;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
      color: #f87171; font-size: 13px; margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Inputs */
    .field { margin-bottom: 14px; position: relative; }
    .field-label {
      font-size: 11px; font-weight: 700; color: #4b5563;
      letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 7px;
      display: block;
    }
    .field-wrap {
      position: relative; display: flex; align-items: center;
    }
    .field-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: #4b5563;
    }
    .field input {
      width: 100%; height: 50px;
      padding: 0 16px 0 46px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      color: white; font-size: 15px; font-family: 'Inter', sans-serif;
      outline: none; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: #a855f7;
      background: rgba(168,85,247,0.08);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.12);
    }
    .field input::placeholder { color: #374151; }

    /* Hint row */
    .hint-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; margin-top: 4px;
    }
    .hint-row span { font-size: 12px; color: #374151; }
    .hint-val { color: #a78bfa !important; font-weight: 700; }

    /* Submit */
    .submit-btn {
      width: 100%; height: 52px;
      background: linear-gradient(90deg, #7c3aed, #c026d3);
      border: none; border-radius: 16px;
      color: white; font-weight: 800; font-size: 16px;
      cursor: pointer; transition: all 0.25s;
      box-shadow: 0 0 28px rgba(124,58,237,0.3);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.3px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(217,70,239,0.45);
    }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,255,255,0.06);
    }
    .divider span { font-size: 12px; color: #374151; white-space: nowrap; }

    /* Quick access */
    .quick-btn {
      width: 100%; height: 46px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      color: #9ca3af; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .quick-btn:hover {
      background: rgba(124,58,237,0.12);
      border-color: rgba(168,85,247,0.3);
      color: #c084fc;
    }

    @media (max-width: 480px) {
      .card { width: 95%; padding: 36px 28px 32px; }
    }
  </style>
</head>
<body>

<div class="glow-1"></div>
<div class="glow-2"></div>

<!-- Floating bg icons -->
<div class="bg-icons">
  <svg class="bg-icon" width="110" height="68" viewBox="0 0 64 40" fill="none">
    <rect x="1" y="1" width="62" height="38" rx="6" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="5" y="6" width="7" height="6" rx="1.5" fill="#7c3aed"/>
    <rect x="14" y="6" width="7" height="6" rx="1.5" fill="#a855f7"/>
    <rect x="23" y="6" width="7" height="6" rx="1.5" fill="#d946ef"/>
    <rect x="32" y="6" width="7" height="6" rx="1.5" fill="#7c3aed"/>
    <rect x="41" y="6" width="7" height="6" rx="1.5" fill="#a855f7"/>
    <rect x="50" y="6" width="9" height="6" rx="1.5" fill="#d946ef"/>
    <rect x="16" y="33" width="32" height="4" rx="2" fill="#d946ef" opacity="0.7"/>
  </svg>
  <svg class="bg-icon" width="90" height="66" viewBox="0 0 60 44" fill="none">
    <path d="M6 22 C4 14 10 6 18 6 L22 6 L24 14 L36 14 L38 6 L42 6 C50 6 56 14 54 22 C52 32 46 40 40 40 L36 38 C33 40 27 40 24 38 L20 40 C14 40 8 32 6 22Z" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="12" y="17" width="4" height="12" rx="2" fill="#a855f7"/>
    <rect x="9" y="20" width="10" height="4" rx="2" fill="#a855f7"/>
    <circle cx="42" cy="18" r="3.5" fill="#d946ef"/>
    <circle cx="48" cy="22" r="3.5" fill="#7c3aed"/>
    <circle cx="42" cy="26" r="3.5" fill="#4ade80"/>
    <circle cx="36" cy="22" r="3.5" fill="#fbbf24"/>
  </svg>
  <svg class="bg-icon" width="100" height="80" viewBox="0 0 64 52" fill="none">
    <rect x="2" y="2" width="60" height="38" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="6" y="6" width="52" height="30" rx="2" fill="#030712"/>
    <rect x="10" y="10" width="30" height="3" rx="1.5" fill="#7c3aed" opacity="0.6"/>
    <rect x="10" y="16" width="22" height="2" rx="1" fill="#a855f7" opacity="0.5"/>
    <rect x="26" y="40" width="12" height="5" rx="1" fill="none" stroke="#374151" stroke-width="1"/>
    <rect x="18" y="45" width="28" height="3" rx="1.5" fill="none" stroke="#374151" stroke-width="1"/>
  </svg>
  <svg class="bg-icon" width="80" height="80" viewBox="0 0 52 52" fill="none">
    <path d="M8 28 C8 14 44 14 44 28" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="4" y="27" width="10" height="16" rx="5" fill="none" stroke="#d946ef" stroke-width="1"/>
    <rect x="38" y="27" width="10" height="16" rx="5" fill="none" stroke="#d946ef" stroke-width="1"/>
  </svg>
</div>

<!-- Logo -->
<div class="top-logo">
  <div class="logo-text">CyberQazaq</div>
  <div class="logo-sub">Admin Portal</div>
</div>

<!-- Login card -->
<div class="card">
  <div class="card-icon">⚙️</div>
  <div class="card-title">Әкімші кіру</div>
  <div class="card-sub">CyberQazaq басқару панелі</div>

  <div class="error-msg" id="loginError"></div>

  <div class="field">
    <label class="field-label">Логин</label>
    <div class="field-wrap">
      <svg class="field-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <input type="text" id="loginUser" placeholder="Логинді енгізіңіз" value="admin" autocomplete="username">
    </div>
  </div>

  <div class="field">
    <label class="field-label">Құпия сөз</label>
    <div class="field-wrap">
      <svg class="field-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      <input type="password" id="loginPass" placeholder="Құпия сөзді енгізіңіз" autocomplete="current-password">
    </div>
  </div>

  <button class="submit-btn" id="loginBtn" onclick="handleLogin()">
    🔓 Кіру
  </button>

</div>

<script>
  async function handleLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const err  = document.getElementById('loginError');
    const btn  = document.getElementById('loginBtn');

    if (!user || !pass) {
      showError('Логин мен парольді енгізіңіз');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '⏳ Тексерілуде...';

    try {
      const res  = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user, pass })
      });
      const data = await res.json();

      if (data.ok) {
        btn.innerHTML = '✅ Кіріп жатыр...';
        setTimeout(() => window.location.href = '/admin', 500);
      } else {
        showError(data.error || 'Логин немесе пароль қате');
        btn.disabled = false;
        btn.innerHTML = '🔓 Кіру';
      }
    } catch(e) {
      showError('Сервер қосылмады. Серверді қайта қосып көріңіз.');
      btn.disabled = false;
      btn.innerHTML = '🔓 Кіру';
    }
  }

  function showError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 4000);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
